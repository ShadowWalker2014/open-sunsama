name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: ''

concurrency:
  group: desktop-release-${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: true

env:
  API_URL: https://api.opensunsama.com

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            name: macOS-arm64
            artifact_name: macos-arm64
            file_pattern: '*.dmg'
            bundle_path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
            updater_bundle_path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
            updater_file_pattern: '*.app.tar.gz'
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            name: macOS-x64
            artifact_name: macos-x64
            file_pattern: '*.dmg'
            bundle_path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
            updater_bundle_path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
            updater_file_pattern: '*.app.tar.gz'
          - platform: ubuntu-22.04
            args: --bundles appimage
            name: Linux
            artifact_name: linux
            file_pattern: '*.AppImage'
            bundle_path: apps/desktop/src-tauri/target/release/bundle/appimage
            updater_bundle_path: apps/desktop/src-tauri/target/release/bundle/appimage
            updater_file_pattern: '*.AppImage'
          - platform: windows-latest
            args: --bundles nsis
            name: Windows
            artifact_name: windows
            file_pattern: '*-setup.exe'
            bundle_path: apps/desktop/src-tauri/target/release/bundle/nsis
            updater_bundle_path: apps/desktop/src-tauri/target/release/bundle/nsis
            updater_file_pattern: '*-setup.exe'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # The version baked into the app must match the version we register, or the auto-updater
      # keeps offering the same update forever. Use `bun run release` to keep them in sync.
      - name: Check version matches tauri.conf.json
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$APP_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Building ${{ steps.version.outputs.version }} but tauri.conf.json says $APP_VERSION. Release with 'bun run release' so the tag and app version match."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.artifact_name }}

      # macOS: Import Apple Developer Certificate for code signing
      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # macOS: Get signing identity from imported certificate
      - name: Get Signing Identity
        if: matrix.platform == 'macos-latest'
        id: signing
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "Error: No Developer ID Application certificate found"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT
          echo "Found signing identity: $IDENTITY"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install

      # macOS: Build with signing and notarization
      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ env.API_URL }}
          VITE_WS_URL: wss://api.opensunsama.com
        run: bunx tauri build ${{ matrix.args }} --verbose

      # macOS: Verify entitlements are embedded in the signed app
      - name: Verify entitlements (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_PATH=$(find apps/desktop/src-tauri/target -name "Open Sunsama.app" -type d | head -1)
          echo "=== Checking entitlements on: $APP_PATH ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 || true
          echo ""
          echo "=== Checking entitlements on binary ==="
          codesign -d --entitlements - "$APP_PATH/Contents/MacOS/open-sunsama-desktop" 2>&1 || true
          echo ""
          echo "=== Verifying signature ==="
          codesign -vvv "$APP_PATH" 2>&1 || true

      # Linux/Windows: Build without Apple signing
      - name: Build Tauri app (Linux/Windows)
        if: matrix.platform != 'macos-latest'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ env.API_URL }}
          VITE_WS_URL: wss://api.opensunsama.com
        run: bunx tauri build ${{ matrix.args }}

      - name: Find built file
        id: find_file
        shell: bash
        run: |
          cd "${{ matrix.bundle_path }}"
          FILE=$(ls ${{ matrix.file_pattern }} 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "No file found matching pattern ${{ matrix.file_pattern }}"
            ls -la
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "path=${{ matrix.bundle_path }}/$FILE" >> $GITHUB_OUTPUT
          # Get file size (cross-platform)
          if [[ "$OSTYPE" == "darwin"* ]]; then
            SIZE=$(stat -f%z "$FILE")
          elif [[ "$OSTYPE" == "msys" ]] || [[ "$OSTYPE" == "cygwin" ]]; then
            SIZE=$(wc -c < "$FILE" | tr -d ' ')
          else
            SIZE=$(stat -c%s "$FILE")
          fi
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          # Get SHA256 (cross-platform)
          if command -v shasum &> /dev/null; then
            SHA=$(shasum -a 256 "$FILE" | cut -d' ' -f1)
          else
            SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          fi
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Find updater artifact and signature
        id: find_updater
        shell: bash
        run: |
          cd "${{ matrix.updater_bundle_path }}"
          echo "=== Updater bundle directory contents ==="
          ls -la

          # Find updater artifact
          UPDATER_FILE=$(ls ${{ matrix.updater_file_pattern }} 2>/dev/null | head -1 || true)
          if [ -z "$UPDATER_FILE" ]; then
            echo "No updater file found matching pattern ${{ matrix.updater_file_pattern }}"
            echo "updater_file=" >> $GITHUB_OUTPUT
            echo "signature=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "updater_file=$UPDATER_FILE" >> $GITHUB_OUTPUT

          # Both macOS builds name their updater "Open Sunsama.app.tar.gz"; give each an
          # arch-specific name in S3 so one build can't overwrite the other's.
          case "$UPDATER_FILE" in
            *.app.tar.gz) UPDATER_KEY="Open Sunsama_${{ steps.version.outputs.version }}_${{ matrix.artifact_name }}.app.tar.gz" ;;
            *) UPDATER_KEY="$UPDATER_FILE" ;;
          esac
          echo "updater_key=$UPDATER_KEY" >> $GITHUB_OUTPUT

          # Read signature file content
          SIG_FILE="${UPDATER_FILE}.sig"
          if [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE")
            echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
            echo "Found signature file: $SIG_FILE"
          else
            echo "No signature file found: $SIG_FILE"
            echo "signature=" >> $GITHUB_OUTPUT
          fi

      - name: Upload to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          S3_DEST="s3://${{ secrets.AWS_S3_BUCKET_NAME }}/releases/v${{ steps.version.outputs.version }}"
          S3_OPTS="--endpoint-url ${{ secrets.AWS_ENDPOINT_URL }}"

          aws s3 cp "${{ steps.find_file.outputs.path }}" "$S3_DEST/${{ steps.find_file.outputs.file }}" $S3_OPTS

          UPDATER_FILE="${{ steps.find_updater.outputs.updater_file }}"
          UPDATER_KEY="${{ steps.find_updater.outputs.updater_key }}"
          if [ -n "$UPDATER_FILE" ]; then
            if [ "${{ matrix.updater_bundle_path }}/$UPDATER_FILE" != "${{ steps.find_file.outputs.path }}" ]; then
              aws s3 cp "${{ matrix.updater_bundle_path }}/$UPDATER_FILE" "$S3_DEST/$UPDATER_KEY" $S3_OPTS
            fi
            if [ -f "${{ matrix.updater_bundle_path }}/$UPDATER_FILE.sig" ]; then
              aws s3 cp "${{ matrix.updater_bundle_path }}/$UPDATER_FILE.sig" "$S3_DEST/$UPDATER_KEY.sig" $S3_OPTS
            fi
          fi

      - name: Register release with API
        shell: bash
        run: |
          # Build updater URL if updater file exists
          UPDATER_URL=""
          if [ -n "${{ steps.find_updater.outputs.updater_file }}" ]; then
            UPDATER_URL="${{ env.API_URL }}/uploads/releases/v${{ steps.version.outputs.version }}/${{ steps.find_updater.outputs.updater_key }}"
          fi

          # Escape signature for JSON (replace newlines)
          SIGNATURE=$(echo '${{ steps.find_updater.outputs.signature }}' | tr -d '\n')

          curl --fail -X POST "${{ env.API_URL }}/releases" \
            -H "Content-Type: application/json" \
            -H "X-Release-Secret: ${{ secrets.RELEASE_SECRET }}" \
            -d "{
              \"version\": \"${{ steps.version.outputs.version }}\",
              \"platform\": \"${{ matrix.artifact_name }}\",
              \"downloadUrl\": \"${{ env.API_URL }}/uploads/releases/v${{ steps.version.outputs.version }}/${{ steps.find_file.outputs.file }}\",
              \"fileSize\": ${{ steps.find_file.outputs.size }},
              \"fileName\": \"${{ steps.find_file.outputs.file }}\",
              \"sha256\": \"${{ steps.find_file.outputs.sha256 }}\",
              \"signature\": \"${SIGNATURE}\",
              \"updaterUrl\": \"${UPDATER_URL}\"
            }"

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ steps.find_file.outputs.path }}
          retention-days: 30

  verify:
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check every platform serves this version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          LATEST=$(curl -sf "$API_URL/releases/latest")
          FAILED=0
          echo "## Desktop Release v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Live version | Size | Download |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          for p in macos-arm64 macos-x64 windows linux; do
            LIVE=$(echo "$LATEST" | jq -r ".data[\"$p\"].version // \"missing\"")
            SIZE=$(echo "$LATEST" | jq -r ".data[\"$p\"].fileSize // 0")
            URL=$(echo "$LATEST" | jq -r ".data[\"$p\"].downloadUrl // \"\"")
            UPDATER=$(echo "$LATEST" | jq -r ".data[\"$p\"].updaterUrl // \"\"")
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -I "${URL// /%20}" || echo 000)
            UPDATER_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -I "${UPDATER// /%20}" || echo 000)
            [ "$UPDATER_STATUS" != "200" ] && STATUS="$STATUS, updater $UPDATER_STATUS"
            echo "| $p | $LIVE | $((SIZE / 1024 / 1024)) MB | HTTP $STATUS |" >> $GITHUB_STEP_SUMMARY
            if [ "$LIVE" != "$VERSION" ] || [ "$STATUS" != "200" ]; then
              echo "::error::$p serves $LIVE (download HTTP $STATUS), expected $VERSION"
              FAILED=1
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Downloads: https://opensunsama.com/download" >> $GITHUB_STEP_SUMMARY
          exit $FAILED
